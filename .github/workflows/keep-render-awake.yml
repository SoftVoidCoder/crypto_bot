name: keep-render-awake

# Render's free plan stops a web service after ~15 minutes without inbound
# traffic, and a stopped container does not trade. This scheduled ping keeps
# crypto-bot-dry awake so the dry-run loop keeps evaluating candles.
#
# GitHub's scheduler can run a few minutes late under load, which is fine: the
# ping also wakes an already-sleeping instance.
#
# Turn this off by deleting this file, or by disabling the workflow under
# Actions -> keep-render-awake -> Disable workflow.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the bot and confirm it answers
        run: |
          set -uo pipefail
          URL="https://crypto-bot-dry.onrender.com/api/v1/ping"

          for attempt in 1 2 3; do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 120 "$URL" 2>/dev/null || echo 000)
            echo "attempt $attempt: HTTP $code $(cat "$body")"
            rm -f "$body"

            if [ "$code" = "200" ]; then
              echo "bot is awake"
              exit 0
            fi
            sleep 20
          done

          echo "::error::crypto-bot-dry did not answer 200 on /api/v1/ping"
          exit 1
