name: keep-render-awake

# Render's free plan stops a web service after ~15 minutes without inbound
# traffic, and a stopped container does not trade. This scheduled ping keeps
# both bots awake.
#
# GitHub's scheduler can run a few minutes late under load, which is fine: the
# ping also wakes an already-sleeping instance.
#
# Turn this off by deleting this file, or by disabling the workflow under
# Actions -> keep-render-awake -> Disable workflow.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://crypto-bot-testnet-k0px.onrender.com/api/v1/ping
          - https://crypto-bot-mainnet.onrender.com/api/v1/ping
    steps:
      - name: Ping ${{ matrix.url }}
        run: |
          set -uo pipefail

          for attempt in 1 2 3; do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 120 "${{ matrix.url }}" 2>/dev/null || echo 000)
            echo "attempt $attempt: HTTP $code $(cat "$body")"
            rm -f "$body"

            if [ "$code" = "200" ]; then
              echo "awake: ${{ matrix.url }}"
              exit 0
            fi
            sleep 20
          done

          echo "::error::${{ matrix.url }} did not answer 200"
          exit 1
